<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoEats — Logistique & Communication</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #1a1a1a; }
    p { color: #666; margin-bottom: 2rem; }
    .cards {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 2rem;
      width: 220px;
      text-decoration: none;
      color: #1a1a1a;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .card p { font-size: 0.85rem; color: #888; margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌿 EcoEats</h1>
    <p>Logistique & Communication — Part B</p>
    <div class="cards">
      <a href="/courier.html" class="card">
        <div class="icon">🚴</div>
        <h2>Espace Livreur</h2>
        <p>Chat privé avec le staff</p>
      </a>
      <a href="/staff.html" class="card">
        <div class="icon">🧑‍💼</div>
        <h2>Espace Staff</h2>
        <p>Salon de groupe & messages privés</p>
      </a>
    </div>
  </div>
</body>
</html>
