<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoEats — Espace Livreur</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1a1a;
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.1rem; }
    .status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #333;
    }
    .status.connected { background: #166534; }
    .login {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 2rem;
    }
    .login-box {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
      border: 1px solid #e0e0e0;
    }
    .login-box h2 { margin-bottom: 1.5rem; font-size: 1.2rem; }
    select, input, button {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 1rem;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    button {
      background: #1a1a1a;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #333; }
    .chat { display: none; flex: 1; flex-direction: column; padding: 1rem; gap: 1rem; }
    .chat.active { display: flex; }
    .messages {
      flex: 1;
      background: white;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .message.sent {
      background: #1a1a1a;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.received {
      background: #f0f0f0;
      color: #1a1a1a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message .meta {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-top: 4px;
    }
    .typing-indicator {
      font-size: 0.8rem;
      color: #888;
      height: 20px;
      padding: 0 4px;
    }
    .input-area {
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      margin: 0;
    }
    .input-area button {
      width: auto;
      padding: 10px 20px;
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚴 Espace Livreur</h1>
    <span class="status" id="status">Déconnecté</span>
  </header>

  <div class="login" id="login">
    <div class="login-box">
      <h2>Se connecter</h2>
      <select id="courierId">
        <option value="courier-1">Jean Dupont (Standard)</option>
        <option value="courier-2">Marie Martin (Expert)</option>
        <option value="courier-3">Paul Bernard (Standard)</option>
      </select>
      <button onclick="connect()">Se connecter</button>
    </div>
  </div>

  <div class="chat" id="chat">
    <div style="font-size:0.85rem; color:#666;">
      💬 Chat privé avec <strong>moderator-1</strong>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing-indicator" id="typing"></div>
    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Écrire un message..."
        onkeyup="handleKeyUp(event)"
        oninput="handleTyping()"
        onfocus="handleTyping()"
        onblur="stopTyping()"
      />
      <button onclick="sendMessage()">Envoyer</button>
    </div>
  </div>

  <script>
    let socket = null;
    let typingTimeout = null;
    let isTyping = false;
    const MODERATOR_ID = 'moderator-1';

    function connect() {
      const courierId = document.getElementById('courierId').value;

      socket = io('http://localhost:3000/private', {
        query: { userId: courierId },
        transports: ['websocket'],
      });

      socket.on('connect', () => {
        document.getElementById('status').textContent = `Connecté (${courierId})`;
        document.getElementById('status').classList.add('connected');
        document.getElementById('login').style.display = 'none';
        document.getElementById('chat').classList.add('active');
        socket.emit('history', { peerId: MODERATOR_ID });
      });

      socket.on('disconnect', () => {
        document.getElementById('status').textContent = 'Déconnecté';
        document.getElementById('status').classList.remove('connected');
      });

      socket.on('history', (messages) => {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        messages.forEach((m) => {
          const isSent = m.senderId === courierId;
          addMessage(m.content, isSent, m.senderId, m.sentAt);
        });
      });

      socket.on('private_message', (message) => {
        const isSent = message.senderId === courierId;
        addMessage(message.content, isSent, message.senderId, message.sentAt);
      });

      socket.on('error', (err) => {
        console.error('WS error', err);
      });

      socket.on('user_typing', () => {
        document.getElementById('typing').textContent = 'Le modérateur est en train d\'écrire...';
      });

      socket.on('user_stop_typing', () => {
        document.getElementById('typing').textContent = '';
      });
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content || !socket) return;

      socket.emit('send_private_message', {
        receiverId: MODERATOR_ID,
        content,
      });

      input.value = '';
      stopTyping();
    }

    function handleKeyUp(event) {
      if (event.key === 'Enter') sendMessage();
    }

    function handleTyping() {
      if (!socket) return;
      if (!isTyping) {
        isTyping = true;
        socket.emit('typing', { receiverId: MODERATOR_ID });
      }
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(stopTyping, 1500);
    }

    function stopTyping() {
      if (!isTyping || !socket) return;
      isTyping = false;
      socket.emit('stop_typing', { receiverId: MODERATOR_ID });
    }

    function addMessage(content, isSent, senderId, sentAt) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      const time = new Date(sentAt).toLocaleTimeString('fr-FR', {
        hour: '2-digit', minute: '2-digit'
      });
      div.innerHTML = `
        <div>${content}</div>
        <div class="meta">${isSent ? 'Moi' : senderId} · ${time}</div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
